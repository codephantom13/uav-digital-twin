<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#080810;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
  canvas{display:block;cursor:grab}
  canvas:active{cursor:grabbing}
  .panel{position:absolute;background:rgba(12,12,20,0.92);border-radius:10px;padding:14px;color:#ccd;font-size:11.5px;z-index:10;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(8px)}
  .panel h3{color:#6ea8fe;margin-bottom:8px;font-size:13.5px;letter-spacing:.3px}
  .st{color:#fbbf24;font-weight:600;margin-top:10px;margin-bottom:3px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .dim{color:#7a7e8a;font-size:10px}
  label{display:flex;align-items:center;gap:5px;margin:3px 0;cursor:pointer;transition:color .15s}
  label:hover{color:#fff}
  input[type=range]{width:100%;margin:4px 0;accent-color:#6ea8fe;height:4px}
  input[type=checkbox]{accent-color:#6ea8fe;width:13px;height:13px;border-radius:3px}
  .btn{background:#1d4ed8;color:#fff;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;margin:2px;font-size:10.5px;transition:all .15s;border:1px solid rgba(255,255,255,0.08)}
  .btn:hover{background:#2563eb;transform:translateY(-1px)}
  .btn.on{background:#16a34a;border-color:#22c55e44}
  .legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .leg{display:flex;align-items:center;gap:3px;font-size:10px}
  .lc{width:9px;height:9px;border-radius:2px;border:1px solid rgba(255,255,255,0.12)}
  #hud{position:absolute;top:10px;right:14px;color:#6ea8fe;font:12px 'Cascadia Code',monospace;z-index:10;text-align:right;text-shadow:0 0 12px rgba(96,165,250,.3)}
  #hover{position:absolute;bottom:14px;right:14px;color:#fbbf24;font:11.5px 'Segoe UI',system-ui,sans-serif;z-index:10;max-width:420px;text-align:right;text-shadow:0 0 8px rgba(251,191,36,.2)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hover"></div>

<div class="panel" style="top:10px;left:10px;width:215px;max-height:96vh;overflow-y:auto">
  <h3>🛩️ TAPAS-BH Aero-Diesel</h3>
  <div class="dim">2.2 L · 4-Cyl Turbodiesel · 85×96 mm</div>

  <div class="st">⚙️ Animation</div>
  <button class="btn on" id="bPlay" onclick="togglePlay()">▶ Running</button>
  <button class="btn" id="bExp" onclick="toggleExplode()">💥 Explode</button>
  <button class="btn" id="bCut" onclick="toggleCutaway()">🔪 Cutaway</button>
  <label>RPM <b id="rV">1500</b>
    <input type="range" id="rS" min="300" max="4000" value="1500" step="50" oninput="rpm=+this.value;rV.textContent=this.value">
  </label>

  <div class="st">👁 Subsystems</div>
  <label><input type="checkbox" checked onchange="V.block=this.checked"> Cylinder Block</label>
  <label><input type="checkbox" checked onchange="V.head=this.checked"> Head & Valvetrain</label>
  <label><input type="checkbox" checked onchange="V.crank=this.checked"> Crankshaft</label>
  <label><input type="checkbox" checked onchange="V.rods=this.checked"> Rods & Pistons</label>
  <label><input type="checkbox" checked onchange="V.fly=this.checked"> Flywheel</label>
  <label><input type="checkbox" checked onchange="V.cam=this.checked"> Camshafts</label>
  <label><input type="checkbox" checked onchange="V.vlv=this.checked"> Valves & Springs</label>
  <label><input type="checkbox" checked onchange="V.turbo=this.checked"> Turbocharger</label>
  <label><input type="checkbox" checked onchange="V.exh=this.checked"> Exhaust</label>
  <label><input type="checkbox" checked onchange="V.intk=this.checked"> Intake</label>
  <label><input type="checkbox" checked onchange="V.fuel=this.checked"> Fuel System</label>
  <label><input type="checkbox" checked onchange="V.oil=this.checked"> Lubrication</label>
  <label><input type="checkbox" checked onchange="V.psru=this.checked"> PSRU & Prop</label>
  <label><input type="checkbox" checked onchange="V.elec=this.checked"> Electrical</label>
  <label><input type="checkbox" checked onchange="V.cool=this.checked"> Cooling</label>

  <div class="st">🎥 Camera</div>
  <button class="btn" onclick="camTo(.6,-.35,5.5)">Default</button>
  <button class="btn" onclick="camTo(0,-.2,5)">Front</button>
  <button class="btn" onclick="camTo(Math.PI/2,-.2,5)">Side</button>
  <button class="btn" onclick="camTo(0,-1.3,5)">Top</button>
  <button class="btn" onclick="camTo(Math.PI,-.2,5)">Rear</button>

  <div class="st" style="margin-top:12px">Legend</div>
  <div class="legend">
    <span class="leg"><span class="lc" style="background:#6b6f78"></span>Block</span>
    <span class="leg"><span class="lc" style="background:#8a8e98"></span>Head</span>
    <span class="leg"><span class="lc" style="background:#b0b4be"></span>Crank</span>
    <span class="leg"><span class="lc" style="background:#c49a50"></span>Rods</span>
    <span class="leg"><span class="lc" style="background:#9598a0"></span>Piston</span>
    <span class="leg"><span class="lc" style="background:#4a80d0"></span>Intake</span>
    <span class="leg"><span class="lc" style="background:#d05040"></span>Exhaust</span>
    <span class="leg"><span class="lc" style="background:#8060c0"></span>Turbo</span>
    <span class="leg"><span class="lc" style="background:#40b060"></span>Fuel</span>
    <span class="leg"><span class="lc" style="background:#c0a030"></span>Oil</span>
    <span class="leg"><span class="lc" style="background:#30b0c0"></span>Cool</span>
    <span class="leg"><span class="lc" style="background:#e08030"></span>PSRU</span>
    <span class="leg"><span class="lc" style="background:#d060a0"></span>Elec</span>
  </div>
  <div class="dim" style="margin-top:8px">🖱 Drag=orbit · Scroll=zoom · Shift+drag=pan</div>
</div>

<script>
// ═══════════════════════════════════════════
//  MINI 3-D RENDERING ENGINE (Canvas 2-D)
//  — backface culling, Phong shading, depth sort
// ═══════════════════════════════════════════
const C=document.getElementById('c'), X=C.getContext('2d');
let W,H; function resize(){W=C.width=innerWidth;H=C.height=innerHeight} resize(); addEventListener('resize',resize);

// camera state
let cYaw=.6, cPit=-.35, cDist=5.5, panX=0, panY=0;
let playing=true, exploded=false, cutaway=false, rpm=1500, cAngle=0;
const V={block:1,head:1,crank:1,rods:1,fly:1,cam:1,vlv:1,turbo:1,exh:1,intk:1,fuel:1,oil:1,psru:1,elec:1,cool:1};

function togglePlay(){playing=!playing;const b=bPlay;b.textContent=playing?'▶ Running':'⏸ Paused';b.className=playing?'btn on':'btn'}
function toggleExplode(){exploded=!exploded;bExp.className=exploded?'btn on':'btn'}
function toggleCutaway(){cutaway=!cutaway;bCut.className=cutaway?'btn on':'btn'}
function camTo(y,p,d){cYaw=y;cPit=p;cDist=d}

// mouse
let drag=0,mx0,my0,sh=0;
C.onmousedown=e=>{drag=1;mx0=e.clientX;my0=e.clientY;sh=e.shiftKey};
C.onmousemove=e=>{if(drag){const dx=e.clientX-mx0,dy=e.clientY-my0;if(e.shiftKey||sh){panX+=dx*.004;panY-=dy*.004}else{cYaw+=dx*.004;cPit=Math.max(-1.5,Math.min(1.5,cPit+dy*.004))}mx0=e.clientX;my0=e.clientY}};
C.onmouseup=C.onmouseleave=()=>drag=0;
C.onwheel=e=>{cDist=Math.max(1.5,Math.min(14,cDist+e.deltaY*.002));e.preventDefault()};

// ─── vector math ───
const v3=(x,y,z)=>[x,y,z];
const vAdd=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const vSub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const vMul=(v,s)=>[v[0]*s,v[1]*s,v[2]*s];
const vDot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const vCross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vLen=v=>Math.sqrt(vDot(v,v));
const vNorm=v=>{const l=vLen(v);return l>1e-8?vMul(v,1/l):v};
const rY=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return[v[0]*c+v[2]*s,v[1],-v[0]*s+v[2]*c]};
const rX=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return[v[0],v[1]*c-v[2]*s,v[1]*s+v[2]*c]};

// project world → screen
function proj(p){
  let v=v3(p[0]-panX,p[1]-panY,p[2]);
  v=rY(v,-cYaw); v=rX(v,-cPit); v[2]+=cDist;
  if(v[2]<.05)return null;
  const f=650; return{x:W/2+v[0]*f/v[2], y:H/2-v[1]*f/v[2], z:v[2]};
}

// light direction
const lightDir=vNorm([.35,.7,-.55]);
const lightDir2=vNorm([-.4,.2,.6]); // fill

// color helpers
function parseCol(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function phong(baseHex, normal, spec){
  const [br,bg,bb]=parseCol(baseHex);
  const n=vNorm(normal);
  // ambient
  const amb=.22;
  // diffuse (key + fill)
  const dKey=Math.max(0,vDot(n,lightDir));
  const dFill=Math.max(0,vDot(n,lightDir2))*.25;
  const diff=dKey+dFill;
  // specular (Blinn-Phong)
  const viewDir=vNorm([0,0,-1]);
  const halfV=vNorm(vAdd(lightDir,vMul(viewDir,-1)));
  const sp=Math.pow(Math.max(0,vDot(n,halfV)),spec||30)*.45;
  const r=Math.min(255,Math.floor(br*(amb+diff*.75)+sp*200));
  const g=Math.min(255,Math.floor(bg*(amb+diff*.75)+sp*200));
  const b=Math.min(255,Math.floor(bb*(amb+diff*.75)+sp*190));
  return`rgb(${r},${g},${b})`;
}

// ─── face buffer ───
let faces=[];
function addFace(verts, baseColor, label, specular, noBackCull){
  const pts=verts.map(proj);
  if(pts.some(p=>!p))return;
  // face normal for backface culling
  const e1=vSub(verts[1],verts[0]), e2=vSub(verts[2],verts[0]);
  const wn=vCross(e1,e2);
  // view-space normal for culling
  let vsn=rY(wn,-cYaw); vsn=rX(vsn,-cPit);
  if(!noBackCull && vsn[2]>0) return; // backface
  // cutaway
  if(cutaway){const cx=(verts[0][2]+verts[1][2]+verts[2][2])/(verts.length>3?verts.length:3);if(cx>0.08)return}
  const color=phong(baseColor,wn,specular||30);
  const depth=pts.reduce((s,p)=>s+p.z,0)/pts.length;
  faces.push({pts,color,depth,label});
}

// ─── primitive builders ───
const S=1/220; // mm → world units
const SEG_HI=28, SEG_MED=20, SEG_LO=14;

function cylinder(cx,cy,cz, r, h, seg, col, label, axis, spec){
  // axis: 'y'(default),'x','z'
  const segs=seg||SEG_HI;
  const sp=spec||35;
  for(let i=0;i<segs;i++){
    const a0=i/segs*Math.PI*2, a1=(i+1)/segs*Math.PI*2;
    let p=[]; // 4 corners of side quad
    if(!axis||axis==='y'){
      p=[[cx+Math.cos(a0)*r,cy,cz+Math.sin(a0)*r],
         [cx+Math.cos(a1)*r,cy,cz+Math.sin(a1)*r],
         [cx+Math.cos(a1)*r,cy+h,cz+Math.sin(a1)*r],
         [cx+Math.cos(a0)*r,cy+h,cz+Math.sin(a0)*r]];
    }else if(axis==='x'){
      p=[[cx,cy+Math.cos(a0)*r,cz+Math.sin(a0)*r],
         [cx,cy+Math.cos(a1)*r,cz+Math.sin(a1)*r],
         [cx+h,cy+Math.cos(a1)*r,cz+Math.sin(a1)*r],
         [cx+h,cy+Math.cos(a0)*r,cz+Math.sin(a0)*r]];
    }else{
      p=[[cx+Math.cos(a0)*r,cy+Math.sin(a0)*r,cz],
         [cx+Math.cos(a1)*r,cy+Math.sin(a1)*r,cz],
         [cx+Math.cos(a1)*r,cy+Math.sin(a1)*r,cz+h],
         [cx+Math.cos(a0)*r,cy+Math.sin(a0)*r,cz+h]];
    }
    addFace(p,col,label,sp);
  }
  // caps
  const topV=[],botV=[];
  for(let i=0;i<segs;i++){
    const a=i/segs*Math.PI*2;
    if(!axis||axis==='y'){
      topV.push([cx+Math.cos(a)*r,cy+h,cz+Math.sin(a)*r]);
      botV.unshift([cx+Math.cos(a)*r,cy,cz+Math.sin(a)*r]);
    }else if(axis==='x'){
      topV.push([cx+h,cy+Math.cos(a)*r,cz+Math.sin(a)*r]);
      botV.unshift([cx,cy+Math.cos(a)*r,cz+Math.sin(a)*r]);
    }else{
      topV.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r,cz+h]);
      botV.unshift([cx+Math.cos(a)*r,cy+Math.sin(a)*r,cz]);
    }
  }
  // split cap into triangles for correct sorting
  const tc=topV[0],bc=botV[0];
  for(let i=1;i<topV.length-1;i++) addFace([tc,topV[i],topV[i+1]],col,label,sp);
  for(let i=1;i<botV.length-1;i++) addFace([bc,botV[i],botV[i+1]],col,label,sp);
}

function tube(p1,p2,radius,seg,col,label,spec){
  const segs=seg||SEG_MED;
  const d=vSub(p2,p1), len=vLen(d);
  if(len<.001)return;
  const dn=vNorm(d);
  let up=[0,1,0]; if(Math.abs(vDot(dn,up))>.99)up=[1,0,0];
  const rt=vNorm(vCross(dn,up)), u2=vNorm(vCross(rt,dn));
  for(let i=0;i<segs;i++){
    const a0=i/segs*Math.PI*2, a1=(i+1)/segs*Math.PI*2;
    const r0=vAdd(vMul(rt,Math.cos(a0)*radius),vMul(u2,Math.sin(a0)*radius));
    const r1=vAdd(vMul(rt,Math.cos(a1)*radius),vMul(u2,Math.sin(a1)*radius));
    addFace([vAdd(p1,r0),vAdd(p1,r1),vAdd(p2,r1),vAdd(p2,r0)],col,label,spec||30);
  }
}

function box(cx,cy,cz,w,h,d,col,label,spec){
  const hw=w/2,hh=h/2,hd=d/2;
  const fs=[
    [[cx-hw,cy+hh,cz-hd],[cx+hw,cy+hh,cz-hd],[cx+hw,cy+hh,cz+hd],[cx-hw,cy+hh,cz+hd]], // top
    [[cx-hw,cy-hh,cz+hd],[cx+hw,cy-hh,cz+hd],[cx+hw,cy-hh,cz-hd],[cx-hw,cy-hh,cz-hd]], // bot
    [[cx-hw,cy-hh,cz+hd],[cx-hw,cy+hh,cz+hd],[cx+hw,cy+hh,cz+hd],[cx+hw,cy-hh,cz+hd]], // front
    [[cx+hw,cy-hh,cz-hd],[cx+hw,cy+hh,cz-hd],[cx-hw,cy+hh,cz-hd],[cx-hw,cy-hh,cz-hd]], // back
    [[cx-hw,cy-hh,cz-hd],[cx-hw,cy+hh,cz-hd],[cx-hw,cy+hh,cz+hd],[cx-hw,cy-hh,cz+hd]], // left
    [[cx+hw,cy-hh,cz+hd],[cx+hw,cy+hh,cz+hd],[cx+hw,cy+hh,cz-hd],[cx+hw,cy-hh,cz-hd]], // right
  ];
  fs.forEach(f=>addFace(f,col,label,spec||20));
}

// rounded box (box with cylindrical edges on the long axis)
function roundBox(cx,cy,cz,w,h,d,rr,col,label,spec){
  // simplified: just a box + edge cylinders for visual rounding
  box(cx,cy,cz,w-rr*2,h,d,col,label,spec);
  box(cx,cy,cz,w,h-rr*2,d,col,label,spec);
  box(cx,cy,cz,w,h,d-rr*2,col,label,spec);
}

// ═══════════════════════════════════════════
//  ENGINE CONSTANTS  (from reference)
// ═══════════════════════════════════════════
const BORE=85*S, STR=96*S, CR=STR/2, RL=160*S;
const BP=104*S, BL=440*S, BW=200*S, DH=247*S;
const LH=155*S, LOD=93*S, PH=85*S;
const MJD=72*S, CPD=54*S, HDW=190*S, HDH=80*S, FWD=310*S;
const cylX=[-1.5,-0.5,0.5,1.5].map(i=>i*BP);
const cOff=[0,Math.PI,Math.PI,0]; // flat-plane inline-4

// ═══════════════════════════════════════════
//  BUILD ENGINE GEOMETRY EACH FRAME
// ═══════════════════════════════════════════
function build(){
  faces.length=0;
  const eF=exploded?1:0;

  // block base-line
  const bBot=-MJD/2-20*S, bTop=DH-CR+3*S;

  // ── CYLINDER BLOCK ──
  if(V.block){
    // main block casting — cast iron grey
    roundBox(0,(bBot+bTop)/2,0, BL,bTop-bBot,BW, 6*S,'#5c5f68','Cylinder Block · 440×200 mm · Deck H ≈ 247 mm',18);
    // liners
    for(let i=0;i<4;i++){
      cylinder(cylX[i],bTop-LH+eF*.12,0, LOD/2,LH, SEG_HI,'#484c55',`Wet Liner #${i+1} · OD 93 mm · ID 85 mm · H 155 mm`,'y',22);
      cylinder(cylX[i],bTop-LH+eF*.12,0, BORE/2,LH, SEG_HI,'#35383f',`Bore #${i+1} · Ø 85 mm`,'y',15);
    }
    // main bearing caps (5)
    for(let i=0;i<5;i++){
      const cx=-2*BP+i*BP;
      box(cx,-MJD/2-22*S-eF*.25,0, 38*S,22*S,MJD*1.15,'#4a4d55',`Main Cap #${i+1} · Ø 72 mm journal`,20);
    }
    // front cover
    box(-BL/2-6*S,(bBot+bTop)/2-.1,0, 10*S,bTop-bBot-.08,BW*.88,'#50535b','Front Cover · crank seal · timing chain',18);
  }

  // ── CRANKSHAFT ──
  if(V.crank){
    const cc='#b0b4be';
    // main journals (cylinders along X)
    for(let i=0;i<5;i++){
      const jx=-2*BP+i*BP;
      cylinder(jx-14*S,0,0, MJD/2,28*S, SEG_HI,cc,`Main Journal #${i+1} · Ø 72 mm`,'x',50);
    }
    for(let i=0;i<4;i++){
      const ph=cOff[i]+cAngle;
      const py=Math.sin(ph)*CR, pz=Math.cos(ph)*CR;
      // crank pin
      cylinder(cylX[i]-12*S,py-CPD/2*.01,pz, CPD/2,24*S, SEG_MED,'#c0c4ce',`Crank Pin #${i+1} · Ø 54 mm`,'x',55);
      // webs
      tube([cylX[i]-14*S,0,0],[cylX[i]-14*S,py,pz], 11*S,SEG_MED,'#8a8e98',`Crank Web #${i+1}`,40);
      tube([cylX[i]+14*S,0,0],[cylX[i]+14*S,py,pz], 11*S,SEG_MED,'#8a8e98',`Crank Web #${i+1}`,40);
      // counterweights
      const cwy=-Math.sin(ph)*CR*.72, cwz=-Math.cos(ph)*CR*.72;
      cylinder(cylX[i]-16*S,cwy-8*S,cwz, 18*S,32*S, SEG_MED,'#70747e','Counterweight','x',30);
    }
    // front nose
    cylinder(-BL/2-18*S-eF*.15,0,0, 13*S,36*S, SEG_MED,'#a0a4ae','Crank Nose · pulley/damper','x',45);
    // pulley
    cylinder(-BL/2-30*S-eF*.18,0,0, 28*S,8*S, SEG_HI,'#3a3d45','Damper Pulley','x',25);
  }

  // ── CON RODS & PISTONS ──
  if(V.rods){
    for(let i=0;i<4;i++){
      const ph=cOff[i]+cAngle;
      const pinY=Math.sin(ph)*CR, pinZ=Math.cos(ph)*CR;
      const pisY=CR*Math.sin(ph)+Math.sqrt(RL*RL-CR*CR*Math.cos(ph)*Math.cos(ph));
      // con rod I-beam
      tube([cylX[i],pinY+eF*(-.08),pinZ],[cylX[i],pisY-PH/2+18*S+eF*.12,0],
        7*S,SEG_MED,'#c49a50',`Con Rod #${i+1} · Big Ø 45 mm · Small Ø 33.8 mm · L ≈ 160 mm`,40);
      // big-end cap
      cylinder(cylX[i]-16*S,pinY-12*S+eF*(-.12),pinZ, 22*S,32*S, SEG_MED,'#a07830',`Rod Cap #${i+1} · 76 mm · 2×M8`,'x',35);
      // piston
      cylinder(cylX[i],pisY-PH/2+eF*.16,0, BORE/2-1.5*S,PH, SEG_HI,'#9598a0',`Piston #${i+1} · Ø 85 mm · H 85 mm`,'y',45);
      // piston crown (slightly darker top)
      cylinder(cylX[i],pisY+PH/2-3*S+eF*.16,0, BORE/2-2*S,3*S, SEG_HI,'#85888f','Piston Crown','y',40);
      // piston pin
      cylinder(cylX[i]-41*S,pisY-PH/2+18*S+eF*.18,0, 33.8*S/2,82*S, SEG_MED,'#c0c3cb',`Gudgeon Pin #${i+1} · Ø 33.8 mm × 82 mm`,'x',55);
      // rings (3 per piston)
      for(let r=0;r<3;r++){
        const ry=pisY+PH/2-(r+1)*9*S+eF*.18;
        cylinder(cylX[i],ry,0, BORE/2+.5*S,3.8*S, SEG_HI,'#303338',`Ring ${r+1}/3 · OD 85 · t 4.3 mm`,'y',60);
      }
    }
  }

  // ── FLYWHEEL ──
  if(V.fly){
    const fx=BL/2+12*S+eF*.35;
    cylinder(fx,0,0, FWD/2,22*S, SEG_HI,'#404348','Flywheel · OD ≈ 310 mm','x',25);
    cylinder(fx-2*S,0,0, FWD/2+5*S,26*S, 32,'#333640','Ring Gear · starter mesh','x',30);
    // hub
    cylinder(fx+1*S,0,0, 30*S,18*S, SEG_MED,'#50535b','Flywheel Hub · 6×M10 bolts','x',35);
  }

  // ── CYLINDER HEAD ──
  if(V.head){
    const hb=bTop+eF*.3;
    // head gasket
    box(0,hb+1*S,0, BL,2.5*S,HDW,'#70737b','Head Gasket · MLS',15);
    // head casting
    roundBox(0,hb+HDH/2+3*S,0, BL,HDH,HDW, 5*S,'#7a7e88','Cylinder Head · 440×190 mm · DOHC',22);
    // combustion chambers (dark recesses)
    for(let i=0;i<4;i++){
      cylinder(cylX[i],hb+2*S,0, BORE/2-2*S,12*S, SEG_HI,'#2a2d34','Combustion Chamber','y',10);
    }
    // rocker cover
    roundBox(0,hb+HDH+18*S+eF*.12,0, BL*.93,30*S,HDW*.82, 4*S,'#55585f','Rocker Cover',18);
    // oil filler cap
    cylinder(BL*.25,hb+HDH+34*S+eF*.13,0, 12*S,10*S, SEG_MED,'#444750','Oil Filler Cap','y',20);
  }

  // ── CAMSHAFTS ──
  if(V.cam){
    const hb=bTop+eF*.3;
    const camY=hb+HDH-12*S+eF*.08;
    const camA=cAngle/2; // half crank speed
    // intake cam (front/near side)
    tube([-BL/2+8*S,camY,-38*S],[BL/2-8*S,camY,-38*S], 12*S,SEG_MED,'#78808a','Intake Camshaft · Ø 25 mm · ½ crank speed',40);
    // exhaust cam
    tube([-BL/2+8*S,camY,38*S],[BL/2-8*S,camY,38*S], 12*S,SEG_MED,'#78808a','Exhaust Camshaft · Ø 25 mm · ½ crank speed',40);
    // cam lobes
    for(let i=0;i<4;i++){
      const lp=cOff[i]/2+camA;
      const intLift=Math.max(0,Math.sin(lp))*5*S;
      const exhLift=Math.max(0,Math.sin(lp+Math.PI*.4))*5*S;
      // intake lobes (2 per cyl)
      for(let v=-1;v<=1;v+=2){
        cylinder(cylX[i]+v*6*S,camY-7*S+intLift,-38*S, 14*S,14*S, SEG_MED,'#5a8a5a',`Intake Lobe · Cyl ${i+1} · base Ø 30 mm`,'y',25);
      }
      for(let v=-1;v<=1;v+=2){
        cylinder(cylX[i]+v*6*S,camY-7*S+exhLift,38*S, 14*S,14*S, SEG_MED,'#8a5a5a',`Exhaust Lobe · Cyl ${i+1}`,'y',25);
      }
    }
    // timing chain + sprockets
    const chX=-BL/2-4*S-eF*.1;
    tube([chX,0,0],[chX,camY,-38*S], 2.5*S,8,'#4a4d55','Timing Chain · crank → intake',20);
    tube([chX,0,0],[chX,camY,38*S], 2.5*S,8,'#4a4d55','Timing Chain · crank → exhaust',20);
    tube([chX,camY,-38*S],[chX,camY,38*S], 2.5*S,8,'#4a4d55','Timing Chain · cam-to-cam',20);
    cylinder(chX,camY,-38*S, 16*S,8*S, SEG_MED,'#60636b','Intake Cam Sprocket','x',30);
    cylinder(chX,camY,38*S, 16*S,8*S, SEG_MED,'#60636b','Exhaust Cam Sprocket','x',30);
    cylinder(chX,0,0, 10*S,8*S, SEG_MED,'#60636b','Crank Sprocket','x',30);
  }

  // ── VALVES & SPRINGS ──
  if(V.vlv){
    const hb=bTop+eF*.3;
    const vBase=hb+8*S;
    for(let i=0;i<4;i++){
      const lp=cOff[i]/2+cAngle/2;
      // 2 intake valves
      for(let v=0;v<2;v++){
        const lift=Math.max(0,Math.sin(lp))*8*S;
        const vx=cylX[i]+(v-0.5)*12*S, vz=-22*S;
        // stem
        tube([vx,vBase-lift,vz],[vx,vBase+48*S,vz], 3*S,10,'#5580b8',`Intake Valve ${i*2+v+1} · Ø 29 mm · stem 6 mm`,50);
        // head disc
        cylinder(vx,vBase-lift-2*S,vz, 14.5*S,2.5*S, SEG_MED,'#4a70a8','Intake Valve Head','y',45);
        // spring
        for(let s=0;s<6;s++){
          const sy=vBase+12*S+s*(36*S-lift)/6;
          const sa=s*Math.PI*.7;
          cylinder(vx,sy,vz, 13*S-s*.3*S,5*S, 8,'#4068a0','Valve Spring · OD 28 mm','y',20);
        }
      }
      // 2 exhaust valves
      for(let v=0;v<2;v++){
        const lift=Math.max(0,Math.sin(lp+Math.PI*.4))*8*S;
        const vx=cylX[i]+(v-0.5)*12*S, vz=22*S;
        tube([vx,vBase-lift,vz],[vx,vBase+48*S,vz], 3*S,10,'#b05848',`Exhaust Valve ${i*2+v+1} · Ø 25 mm · stem 6 mm`,50);
        cylinder(vx,vBase-lift-2*S,vz, 12.5*S,2.5*S, SEG_MED,'#a04838','Exhaust Valve Head','y',45);
        for(let s=0;s<6;s++){
          const sy=vBase+12*S+s*(36*S-lift)/6;
          cylinder(vx,sy,vz, 13*S-s*.3*S,5*S, 8,'#a05040','Valve Spring','y',20);
        }
      }
    }
  }

  // ── INTAKE MANIFOLD ──
  if(V.intk){
    const hb=bTop+eF*.3;
    const iY=hb+HDH/2, iZ=-HDW/2-28*S-eF*.45;
    // plenum
    roundBox(0,iY+12*S,iZ-18*S, BL*.65,38*S,45*S,3*S,'#3a70c0','Intake Plenum',25);
    // runners
    for(let i=0;i<4;i++){
      tube([cylX[i],iY,iZ],[cylX[i],iY,-HDW/2], 16*S,SEG_MED,'#4580d0',`Intake Runner #${i+1} · Ø 35–40 mm`,30);
    }
    // throttle body
    cylinder(-BL*.35,iY+10*S,iZ-40*S, 20*S,20*S, SEG_MED,'#3068b0','Throttle Body','z',30);
  }

  // ── EXHAUST MANIFOLD ──
  if(V.exh){
    const hb=bTop+eF*.3;
    const eY=hb+HDH/2, eZ=HDW/2+18*S+eF*.45;
    for(let i=0;i<4;i++){
      tube([cylX[i],eY,HDW/2],[cylX[i],eY,eZ+12*S], 16*S,SEG_MED,'#c04538',`Exhaust Runner #${i+1} · Ø 35–38 mm`,30);
    }
    // collector merges into a single pipe toward turbo
    tube([cylX[0],eY,eZ+12*S],[0,eY+8*S,eZ+35*S], 14*S,SEG_MED,'#b03a30','Exhaust Collector 1-2',28);
    tube([cylX[3],eY,eZ+12*S],[0,eY+8*S,eZ+35*S], 14*S,SEG_MED,'#b03a30','Exhaust Collector 3-4',28);
    // pipe to turbo
    tube([0,eY+8*S,eZ+35*S],[BL*.2,eY,eZ+55*S+eF*.2], 18*S,SEG_MED,'#a03328','Exhaust → Turbine',28);
  }

  // ── TURBOCHARGER ──
  if(V.turbo){
    const hb=bTop+eF*.3;
    const tY=hb+HDH/2, tZ=HDW/2+75*S+eF*.7, tX=BL*.2;
    // turbine scroll
    cylinder(tX,tY,tZ, 28*S,45*S, SEG_HI,'#6a50a8','Turbine Housing · Wheel Ø 40–45 mm','x',30);
    // center housing
    roundBox(tX,tY,tZ-35*S, 36*S,32*S,30*S,2*S,'#5a4890','Center Housing · bearings + VGT',28);
    // compressor scroll
    cylinder(tX,tY,tZ-65*S, 30*S,50*S, SEG_HI,'#5060b0','Compressor Housing · Wheel Ø 45–50 mm','x',32);
    // shaft (spinning indicator line)
    tube([tX,tY,tZ+22*S],[tX,tY,tZ-65*S], 3.5*S,10,'#9080c0','Turbo Shaft · Ø 8–10 mm',50);
    // VGT actuator
    box(tX+28*S,tY+18*S,tZ, 22*S,16*S,16*S,'#7050a0','VGT Actuator · 60×40×40 mm',22);
    // actuator linkage
    tube([tX+28*S,tY+10*S,tZ],[tX+5*S,tY+5*S,tZ], 2*S,6,'#8070b0','VGT Linkage',20);
    // charge-air pipe → intercooler
    if(V.intk){
      tube([tX,tY,tZ-90*S],[0,tY+25*S,-HDW/2-55*S-eF*.45], 8*S,SEG_LO,'#4090d0','Charge-Air Pipe',25);
      // intercooler
      roundBox(0,tY+25*S,-HDW/2-95*S-eF*.6, 160*S,55*S,22*S,2*S,'#3880c0','Intercooler · 400×150×60 mm',25);
    }
  }

  // ── FUEL SYSTEM ──
  if(V.fuel){
    const hb=bTop+eF*.3;
    const fY=hb+HDH+8*S+eF*.15;
    // common rail
    tube([-BL/2+28*S,fY+18*S,-45*S],[BL/2-28*S,fY+18*S,-45*S], 11*S,SEG_MED,'#30a050','Common Rail · OD 22 mm · L ≈ 375 mm',35);
    // rail end fittings
    cylinder(-BL/2+22*S,fY+18*S,-45*S, 8*S,8*S, SEG_MED,'#28904a','Pressure Sensor','x',30);
    // injectors
    for(let i=0;i<4;i++){
      tube([cylX[i],hb+5*S,0],[cylX[i],fY+12*S,0], 9.5*S/2,SEG_MED,'#40b860',`Injector #${i+1} · Ø 19 mm · L ≈ 130 mm`,40);
      // HP lines (curved tubes)
      tube([cylX[i],fY+18*S,-45*S],[cylX[i],fY+8*S,-15*S], 3*S,8,'#60d880',`HP Line #${i+1} · OD 6 mm`,30);
      tube([cylX[i],fY+8*S,-15*S],[cylX[i],fY+8*S,0], 3*S,8,'#60d880','',30);
      // injector clamp
      box(cylX[i],fY+2*S,0, 16*S,4*S,22*S,'#388a48','Injector Clamp',18);
    }
    // HP pump
    roundBox(-BL/2-28*S-eF*.25,fY-5*S,-28*S, 48*S,55*S,38*S,2*S,'#20804a','HP Pump · 120×100×150 mm · cam-driven',22);
    // fuel filter
    cylinder(-BL/2-75*S-eF*.4,fY-28*S,-28*S, 40*S/2,60*S, SEG_MED,'#28a858','Fuel Filter · Ø 80 mm × 130 mm','y',28);
    // LP line from filter to pump
    tube([-BL/2-75*S-eF*.4,fY-5*S,-28*S],[-BL/2-28*S-eF*.25,fY-5*S,-28*S], 4*S,8,'#50c070','LP Fuel Line · ID 8 mm',22);
  }

  // ── OIL PAN & LUBRICATION ──
  if(V.oil){
    const pTop=-MJD/2-28*S;
    // pan
    roundBox(0,pTop-42*S-eF*.35,0, BL,80*S,BW*1.25, 4*S,'#b0a030','Oil Pan · 440×300×120 mm · 5–6 L',18);
    // drain plug
    cylinder(0,pTop-82*S-eF*.35,0, 8*S,6*S, SEG_MED,'#908020','Drain Plug','y',25);
    // oil pickup
    tube([BL*.2,pTop-65*S-eF*.35,0],[BL*.2,pTop-20*S-eF*.35,28*S], 4.5*S,8,'#c8b840','Oil Pickup / Strainer',25);
    // strainer screen
    cylinder(BL*.2,pTop-68*S-eF*.35,0, 18*S,5*S, SEG_MED,'#a09028','Strainer Screen','y',18);
    // oil filter (side-mounted)
    cylinder(BL/2+8*S,-25*S,-BW/2-8*S-eF*.25, 38*S,45*S, SEG_MED,'#d0c040','Oil Filter · Ø 76 mm × 95 mm','z',30);
    // oil pump
    roundBox(-BL/2-3*S,-8*S,0, 28*S,28*S,36*S,2*S,'#a09028','Oil Pump · gerotor · crank-driven',20);
    // oil cooler
    box(BL/2+12*S,-5*S,-BW/2-28*S-eF*.25, 38*S,38*S,14*S,'#b8a838','Oil Cooler · 100×100×40 mm',22);
  }

  // ── PSRU & PROPELLER ──
  if(V.psru){
    const px=BL/2+55*S+eF*.55;
    // housing
    roundBox(px+35*S,18*S,0, 75*S,120*S,120*S,4*S,'#d07828','PSRU Housing · 300×300×200 mm',20);
    // input shaft
    tube([BL/2+18*S+eF*.35,0,0],[px,0,0], 14*S,SEG_MED,'#c06828','Input Shaft · Ø 30–35 mm',40);
    // gears (visible through cutaway suggestion)
    cylinder(px+20*S,0,0, 22*S,15*S, SEG_MED,'#a05820','Input Gear','x',35);
    const outY=45*S;
    cylinder(px+20*S,outY,0, 35*S,15*S, SEG_MED,'#c07030','Output Gear · 0.5:1 ratio','x',35);
    // output shaft
    tube([px+18*S,outY,0],[px+110*S+eF*.25,outY,0], 18*S,SEG_MED,'#e08838','Output Shaft · Ø 40–50 mm',42);
    // torsional damper
    cylinder(px+115*S+eF*.28,outY,0, 75*S/2,18*S, SEG_HI,'#c07838','Torsional Damper · OD ≈ 150 mm','x',25);
    // prop flange
    cylinder(px+135*S+eF*.35,outY,0, 55*S/2,12*S, SEG_HI,'#d89848','Prop Flange · AS127 pattern','x',38);
    // propeller hub
    cylinder(px+150*S+eF*.4,outY,0, 22*S,16*S, SEG_MED,'#e0a858','Propeller Hub','x',35);
    // prop blades (3, animated at 0.5× crank speed)
    const pA=cAngle*.5, pX=px+165*S+eF*.48;
    for(let b=0;b<3;b++){
      const ba=pA+b*Math.PI*2/3;
      // blade (wider at root, tapered)
      const bLen=180*S;
      const steps=6;
      for(let s=0;s<steps;s++){
        const t0=s/steps, t1=(s+1)/steps;
        const r0=bLen*t0, r1=bLen*t1;
        const w0=(1-t0*.6)*8*S, w1=(1-t1*.6)*8*S;
        const p0=[pX,outY+Math.sin(ba)*r0,Math.cos(ba)*r0];
        const p1=[pX,outY+Math.sin(ba)*r1,Math.cos(ba)*r1];
        tube(p0,p1, w0,6,'#d8a858',`Prop Blade ${b+1}`,28);
      }
    }
  }

  // ── ELECTRICAL / FADEC ──
  if(V.elec){
    const hb=bTop+eF*.3;
    // FADEC
    roundBox(0,hb+HDH+55*S+eF*.2,-HDW/2-35*S, 95*S,28*S,60*S,2*S,'#d060a0','FADEC · 220×160×70 mm · dual-lane',22);
    // connector
    box(35*S,hb+HDH+55*S+eF*.2,-HDW/2-35*S, 12*S,10*S,8*S,'#e080b8','FADEC Connector',18);
    // alternator
    cylinder(-BL/2-16*S-eF*.15,25*S,BW/2+8*S+eF*.25, 55*S/2,45*S, SEG_MED,'#c058a0','Alternator · Ø 110 mm · belt-driven','z',30);
    // starter motor
    cylinder(BL/2+3*S,-MJD/2-15*S,BW/2+6*S+eF*.25, 40*S/2,105*S, SEG_MED,'#b048a0','Starter Motor · Ø 80 × 250 mm','x',28);
    // belt
    tube([-BL/2-28*S,0,18*S],[-BL/2-16*S,25*S,BW/2+28*S+eF*.25], 2*S,6,'#d878b8','Drive Belt',20);
    // wiring harness traces
    tube([0,hb+HDH+55*S+eF*.2,-HDW/2-35*S],[cylX[1],hb+HDH/2+eF*.3,0], 1.5*S,4,'#e898c8','Wiring Harness',15);
    tube([0,hb+HDH+55*S+eF*.2,-HDW/2-35*S],[cylX[2],hb+HDH/2+eF*.3,0], 1.5*S,4,'#e898c8','Wiring Harness',15);
  }

  // ── COOLING ──
  if(V.cool){
    const hb=bTop+eF*.3;
    // water pump
    cylinder(-BL/2-20*S-eF*.15,55*S,-35*S, 28*S,28*S, SEG_MED,'#30a8b8','Water Pump · Impeller Ø 55–60 mm','x',30);
    // pump body
    roundBox(-BL/2-20*S-eF*.15,55*S,-35*S, 36*S,36*S,28*S,2*S,'#28909e','Pump Body · 90×90×70 mm',22);
    // thermostat housing
    roundBox(BL*.2,hb+HDH+4*S+eF*.12,-HDW*.3, 28*S,22*S,22*S,2*S,'#38b8c8','Thermostat Housing · Ø 54 mm',25);
    // coolant hoses
    tube([-BL/2-20*S,68*S,-35*S],[-BL/2-10*S,hb+15*S+eF*.3,-35*S], 7*S,SEG_LO,'#48c8d8','Coolant Hose · ID 32 mm',22);
    tube([BL*.2,hb+HDH+4*S+eF*.12,-HDW*.3],[BL*.35,hb+HDH+30*S+eF*.15,-HDW*.4], 6*S,8,'#48c8d8','Upper Hose',22);
  }
}

// ═══════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════
let t0=0;
function frame(t){
  const dt=(t-t0)/1000; t0=t;
  if(playing) cAngle+=(rpm/60)*Math.PI*2*dt;
  X.fillStyle='#080810'; X.fillRect(0,0,W,H);

  // subtle gradient background
  const grd=X.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.6);
  grd.addColorStop(0,'#10121a'); grd.addColorStop(1,'#080810');
  X.fillStyle=grd; X.fillRect(0,0,W,H);

  // ground grid
  X.globalAlpha=.1;
  for(let i=-25;i<=25;i++){
    const s=.18;
    const a=proj([i*s,-1.3,-5]),b=proj([i*s,-1.3,5]);
    const c=proj([-5,-1.3,i*s]),d=proj([5,-1.3,i*s]);
    X.strokeStyle='#334';X.lineWidth=.4;
    if(a&&b){X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.stroke()}
    if(c&&d){X.beginPath();X.moveTo(c.x,c.y);X.lineTo(d.x,d.y);X.stroke()}
  }
  X.globalAlpha=1;

  // build & sort
  build();
  faces.sort((a,b)=>b.depth-a.depth);

  // draw faces
  for(const f of faces){
    X.fillStyle=f.color;
    X.beginPath();
    X.moveTo(f.pts[0].x,f.pts[0].y);
    for(let i=1;i<f.pts.length;i++) X.lineTo(f.pts[i].x,f.pts[i].y);
    X.closePath();
    X.fill();
    // subtle edge
    X.strokeStyle='rgba(0,0,0,.18)';
    X.lineWidth=.4;
    X.stroke();
  }

  // axis gizmo
  const ao=proj([-2.1,-1.1,0]),
        ax=proj([-1.95,-1.1,0]),
        ay=proj([-2.1,-.95,0]),
        az=proj([-2.1,-1.1,.15]);
  X.lineWidth=2;
  if(ao&&ax){X.strokeStyle='#f55';X.beginPath();X.moveTo(ao.x,ao.y);X.lineTo(ax.x,ax.y);X.stroke();X.fillStyle='#f55';X.font='bold 10px sans-serif';X.fillText('X',ax.x+2,ax.y+3)}
  if(ao&&ay){X.strokeStyle='#5f5';X.beginPath();X.moveTo(ao.x,ao.y);X.lineTo(ay.x,ay.y);X.stroke();X.fillStyle='#5f5';X.fillText('Y',ay.x+2,ay.y-2)}
  if(ao&&az){X.strokeStyle='#55f';X.beginPath();X.moveTo(ao.x,ao.y);X.lineTo(az.x,az.y);X.stroke();X.fillStyle='#55f';X.fillText('Z',az.x+2,az.y+3)}

  // HUD
  const deg=((cAngle*180/Math.PI)%360+360)%360;
  let hudStr=`${deg.toFixed(0)}° · ${rpm} RPM · ${playing?'RUNNING':'PAUSED'}`;
  // stroke per cylinder
  const strokes=['INTAKE','COMPR','POWER','EXHAUST'];
  const cylStr=[1,2,3,4].map(c=>{
    const ph=cOff[c-1]+cAngle;
    const d=((ph*180/Math.PI)%720+720)%720;
    return`C${c}:${strokes[Math.floor(d/180)]}`;
  }).join('  ');
  document.getElementById('hud').innerHTML=`${hudStr}<br><span style="color:#fbbf24;font-size:11px">${cylStr}</span>`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// hover detection
C.addEventListener('mousemove',e=>{
  if(drag)return;
  const mx=e.clientX,my=e.clientY;
  let found=null;
  for(let i=faces.length-1;i>=0;i--){
    const f=faces[i]; let inside=false;
    for(let j=0,k=f.pts.length-1;j<f.pts.length;k=j++){
      const yi=f.pts[j].y,yk=f.pts[k].y,xi=f.pts[j].x,xk=f.pts[k].x;
      if((yi>my)!==(yk>my)&&mx<(xk-xi)*(my-yi)/(yk-yi)+xi) inside=!inside;
    }
    if(inside&&f.label){found=f.label;break}
  }
  document.getElementById('hover').textContent=found?`🔍 ${found}`:'';
});
</script>
